services:
  hardhat-node:
    build: .
    ports:
      - "8545:8545"
    healthcheck:
      # Passes only after CourseRegistry has code at its deterministic address
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_RPC_PROXY_TARGET=http://hardhat-node:8545
    volumes:
      # Mount source so edits reflect instantly without rebuilding the image
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      hardhat-node:
        condition: service_healthy
